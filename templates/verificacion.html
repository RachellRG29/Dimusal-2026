<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIMUSAL – Verificar correo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Syne", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
      }
      .card {
        background: white;
        border-radius: 20px;
        padding: 48px 40px;
        width: 100%;
        max-width: 440px;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        color: #f97316;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #1a1a1a;
      }
      p {
        font-size: 14px;
        color: #888;
        margin-bottom: 32px;
        line-height: 1.6;
      }
      p span {
        color: #f97316;
        font-weight: 600;
      }
      .codigo-inputs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 32px;
      }
      .codigo-inputs input {
        width: 64px;
        height: 72px;
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        border: 2px solid #e5e5e5;
        border-radius: 12px;
        outline: none;
        transition: border-color 0.2s;
        font-family: "Syne", sans-serif;
      }
      .codigo-inputs input:focus {
        border-color: #f97316;
      }
      .btn {
        width: 100%;
        padding: 16px;
        background: #f97316;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        font-family: "Syne", sans-serif;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .reenviar {
        margin-top: 20px;
        font-size: 13px;
        color: #888;
      }
      .reenviar a {
        color: #f97316;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">DIMUSAL</div>
      <h1>Verifica tu correo</h1>
      <p>
        Enviamos un código de 4 dígitos a<br /><span id="correo-display"></span>
      </p>

      <div class="codigo-inputs">
        <input type="text" maxlength="1" id="d1" inputmode="numeric" />
        <input type="text" maxlength="1" id="d2" inputmode="numeric" />
        <input type="text" maxlength="1" id="d3" inputmode="numeric" />
        <input type="text" maxlength="1" id="d4" inputmode="numeric" />
      </div>

      <button class="btn" id="btn-verificar">Verificar cuenta</button>

      <p class="reenviar">
        ¿No recibiste el código? <a id="btn-reenviar">Reenviar</a>
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/verificacion.js"></script>
  </body>
</html>
