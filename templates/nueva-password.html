<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIMUSAL – Nueva contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/login/login.css" />
    <link rel="stylesheet" href="/css/paleta-colores.css" />
  </head>
  <body>
    <div class="formulario-login">
      <div class="login-left">
        <img
          class="login-left__bg"
          src="../images/homepage/banner-piano.png"
          alt=""
        />
        <div class="login-left__overlay"></div>
        <div class="login-left__content">
          <span class="login-left__logo">DIMUSAL</span>
          <p class="login-left__tagline">
            Impulsa tu carrera musical<br />en El Salvador
          </p>
        </div>
      </div>

      <div class="login-right">
        <div class="login-card">
          <h1 class="login-card__title">Nueva contraseña</h1>
          <p class="login-card__subtitle">
            Crea una nueva contraseña segura para tu cuenta.
          </p>

          <div class="login-field">
            <label for="nuevaPassword">Nueva contraseña</label>
            <div class="login-field__input-wrap">
              <input
                type="password"
                id="nuevaPassword"
                autocomplete="new-password"
              />
              <span
                class="login-field__eye"
                id="toggleNueva"
                aria-label="Ver contraseña"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
          </div>

          <div class="login-field">
            <label for="confirmarPassword">Confirmar contraseña</label>
            <div class="login-field__input-wrap">
              <input
                type="password"
                id="confirmarPassword"
                autocomplete="new-password"
              />
              <span
                class="login-field__eye"
                id="toggleConfirmar"
                aria-label="Ver contraseña"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
          </div>

          <!-- Requisitos -->
          <div
            id="password-requisitos"
            style="
              display: none;
              flex-direction: column;
              gap: 4px;
              margin-bottom: 16px;
              padding: 12px 16px;
              background: #fafafa;
              border-radius: 10px;
              border: 1px solid #e0ddd8;
            "
          >
            <span id="req-length" style="font-size: 12px; color: #aaa"
              >✗ Mínimo 8 caracteres</span
            >
            <span id="req-upper" style="font-size: 12px; color: #aaa"
              >✗ Una letra mayúscula</span
            >
            <span id="req-lower" style="font-size: 12px; color: #aaa"
              >✗ Una letra minúscula</span
            >
            <span id="req-number" style="font-size: 12px; color: #aaa"
              >✗ Un número</span
            >
            <span id="req-sign" style="font-size: 12px; color: #aaa"
              >✗ Un carácter especial</span
            >
          </div>

          <button class="login-btn" type="button" id="btnCambiarPassword">
            Cambiar contraseña
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/nueva-password.js"></script>
  </body>
</html>
