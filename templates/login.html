<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIMUSAL – Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/login/login.css" />
    <link rel="stylesheet" href="/css/paleta-colores.css" />

    <link rel="stylesheet" href="/css/btn-idioma.css" />
  </head>
  <body>
    <div class="formulario-login">
      <!-- ══ LADO IZQUIERDO ══ -->
      <div class="login-left">
        <!-- bg imagen — reemplaza src con tu imagen -->
        <img
          class="login-left__bg"
          src="../images/homepage/banner-piano.png"
          alt=""
        />
        <!-- overlay negro 40% -->
        <div class="login-left__overlay"></div>

        <div class="login-left__content">
          <span class="login-left__logo">DIMUSAL</span>
          <p
            class="login-left__tagline"
            data-es='"Impulsa tu carrera musical<br/>en El Salvador"'
            data-en='"Boost your music career <br/> in El Salvador"'
          >
            Impulsa tu carrera musical<br />en El Salvador
          </p>
        </div>
      </div>

      <!-- ══ BOTON IDIOMA DE LOGIN ══ -->
      <a class="btn-idioma btn-idioma-login" id="btnIdioma">
        <div class="icon-idioma">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            xml:space="preserve"
          >

              style="fill: #fff"

            />
            <path
              style="fill: #0084ff"
              d="m361.15 406.306-80.671 95.239-31.69-95.239z"
            />
            <path
              style="fill: #10bafc"
              d="M361.15 406.306H49.137c-21.364 0-38.688-17.32-38.688-38.69V49.138c0-21.365 17.32-38.689 38.688-38.689h182.387z"
            />

            />
          </svg>
        </div>

        <span class="texto-idioma">ES</span>
      </a>

      <!-- ══ LADO DERECHO: formulario ══ -->
      <div class="login-right">
        <div class="login-card">
          <h1
            class="login-card__title"
            data-es="Bienvenido"
            data-en="Bienvenido"
          ></h1>
          <p
            class="login-card__subtitle"
            data-es="Tu talento merece ser escuchado. Descubre oportunidades,
            colaboraciones y eventos en la industria musical salvadoreña."
            data-en="Your talent deserves to be heard. Discover opportunities, collaborations, and events in the Salvadoran music industry."
          ></p>

          <!-- Correo -->
          <div class="login-field">
            <label
              for="email"
              data-es="Correo electrónico"
              data-en="Email"
            ></label>
            <div class="login-field__input-wrap">
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
              />
            </div>
          </div>

          <!-- Contraseña -->
          <div class="login-field">
            <label
              for="password"
              data-es="Contraseña"
              data-en="Password"
            ></label>
            <div class="login-field__input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
              />
              <span
                class="login-field__eye"
                id="togglePassword"
                aria-label="Ver contraseña"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
          </div>

          <p
            class="login-forgot"
            data-es="¿Olvidaste tu contraseña?"
            data-en="Forgot your password?"
          >
            ¿Olvidaste tu contraseña?
          </p>

          <button
            class="login-btn"
            type="button"
            data-es="Inicia sesión"
            data-en="Login"
          >
            Inicia sesión
          </button>

          <p
            class="login-register"
            data-es='¿Aún no tienes cuenta? <a href="/register.html">[Regístrate gratis]</a>'
            data-en='Don&apos;t have an account yet? <a href="/register.html">[Register for free]</a>'
          >
            ¿Aún no tienes cuenta?
            <a href="/register.html">[Regístrate gratis]</a>
          </p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/login.js/login.js"></script>
    <script src="/js/idioma.js"></script>
  </body>
</html>
