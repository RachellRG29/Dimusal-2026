<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIMUSAL – Recuperar contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/login/login.css" />
    <link rel="stylesheet" href="/css/paleta-colores.css" />
  </head>
  <body>
    <div class="formulario-login">
      <!-- lado izquierdo igual que login -->
      <div class="login-left">
        <img
          class="login-left__bg"
          src="../images/homepage/banner-piano.png"
          alt=""
        />
        <div class="login-left__overlay"></div>
        <div class="login-left__content">
          <span class="login-left__logo">DIMUSAL</span>
          <p class="login-left__tagline">
            Impulsa tu carrera musical<br />en El Salvador
          </p>
        </div>
      </div>

      <!-- lado derecho -->
      <div class="login-right">
        <div class="login-card">
          <h1 class="login-card__title">Recuperar contraseña</h1>
          <p class="login-card__subtitle">
            Ingresa tu correo y te enviaremos un código para restablecer tu
            contraseña.
          </p>

          <div class="login-field">
            <label for="correo">Correo electrónico</label>
            <div class="login-field__input-wrap">
              <input
                type="email"
                id="correo"
                placeholder="tucorreo@ejemplo.com"
                autocomplete="email"
              />
            </div>
          </div>

          <button class="login-btn" type="button" id="btnEnviarCodigo">
            Enviar código
          </button>

          <p class="login-register">
            <a href="/login.html">← Volver al inicio de sesión</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Modal verificación código -->
    <div
      id="modal-recuperar"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 9999;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        style="
          background: #fff;
          border-radius: 20px;
          padding: 40px;
          max-width: 400px;
          width: 90%;
          text-align: center;
        "
      >
        <h2
          style="
            font-family: &quot;Syne&quot;, sans-serif;
            font-size: 1.4rem;
            margin-bottom: 8px;
          "
        >
          Ingresa el código
        </h2>
        <p style="color: #888; font-size: 0.9rem; margin-bottom: 24px">
          Enviamos un código de 4 dígitos a
          <strong id="modal-correo-display"></strong>
        </p>

        <div
          style="
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
          "
        >
          <input
            id="rc1"
            maxlength="1"
            type="text"
            inputmode="numeric"
            style="
              width: 56px;
              height: 64px;
              font-size: 1.8rem;
              text-align: center;
              border: 2px solid #e0ddd8;
              border-radius: 12px;
              font-family: &quot;Syne&quot;, sans-serif;
              outline: none;
            "
          />
          <input
            id="rc2"
            maxlength="1"
            type="text"
            inputmode="numeric"
            style="
              width: 56px;
              height: 64px;
              font-size: 1.8rem;
              text-align: center;
              border: 2px solid #e0ddd8;
              border-radius: 12px;
              font-family: &quot;Syne&quot;, sans-serif;
              outline: none;
            "
          />
          <input
            id="rc3"
            maxlength="1"
            type="text"
            inputmode="numeric"
            style="
              width: 56px;
              height: 64px;
              font-size: 1.8rem;
              text-align: center;
              border: 2px solid #e0ddd8;
              border-radius: 12px;
              font-family: &quot;Syne&quot;, sans-serif;
              outline: none;
            "
          />
          <input
            id="rc4"
            maxlength="1"
            type="text"
            inputmode="numeric"
            style="
              width: 56px;
              height: 64px;
              font-size: 1.8rem;
              text-align: center;
              border: 2px solid #e0ddd8;
              border-radius: 12px;
              font-family: &quot;Syne&quot;, sans-serif;
              outline: none;
            "
          />
        </div>

        <p
          id="modal-timer-rc"
          style="font-size: 0.8rem; color: #aaa; margin-bottom: 16px"
        ></p>
        <p
          id="modal-intentos-rc"
          style="font-size: 0.8rem; color: #aaa; margin-bottom: 20px"
        ></p>

        <button
          id="btnVerificarCodigo"
          style="
            width: 100%;
            padding: 14px;
            background: #f97316;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: &quot;Syne&quot;, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
          "
        >
          Verificar código
        </button>

        <button
          id="btnReenviarCodigo"
          style="
            background: none;
            border: none;
            color: #f97316;
            font-family: &quot;Syne&quot;, sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
          "
        >
          Reenviar código
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/recuperar-password.js"></script>
  </body>
</html>
